<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Animated banner for Lotfi Makhlouf, software engineering student and full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dbeafe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <circle cx="600" cy="118" r="200" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="120" r="205" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6 14" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="0 600 120" to="360 600 120" dur="70s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="120" r="250" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2 20" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="360 600 120" to="0 600 120" dur="90s" repeatCount="indefinite"/>
  </circle>

  <g fill="#93c5fd">
    <circle cx="80" cy="42" r="1.8" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="182" cy="92" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="252" cy="32" r="2.1" opacity="0.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="342" cy="72" r="1.5" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="422" cy="26" r="1.7" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="522" cy="62" r="1.3" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="682" cy="36" r="1.9" opacity="0.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="762" cy="82" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="852" cy="30" r="2" opacity="0.2"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="942" cy="66" r="1.6" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1042" cy="38" r="1.8" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1122" cy="102" r="1.5" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="182" r="1.6" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="202" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="232" r="1.8" opacity="0.2"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="242" r="1.5" opacity="0.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="902" cy="212" r="1.7" opacity="0.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1082" cy="192" r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.9s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="64" y="162" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="58" font-weight="700" fill="#1e3a8a" opacity="0.55">&lt;/&gt;</text>
  <text x="1076" y="162" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="58" font-weight="700" fill="#1e3a8a" opacity="0.55">&gt;_</text>

  <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="1">Lotfi Makhlouf</text>
  <rect x="430" y="145" width="340" height="2" rx="1" fill="url(#line)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#93c5fd" letter-spacing="3">SOFTWARE ENGINEERING STUDENT · FULL-STACK DEVELOPER</text>
  <text x="600" y="208" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748b" letter-spacing="3">UNIVERSITÉ SESAME · TUNISIA</text>
</svg>
